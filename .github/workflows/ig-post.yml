# Posts approved Instagram content when it's due (9 AM / 1 PM / 7 PM New York time).
# Runs on GitHub's servers every 15 minutes, so it works while the Mac is off.
# The queue (ig-queue/<week>.json) holds only posts the owners approved.
name: Instagram posts
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ig-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post what's due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node .github/scripts/ig_post.mjs
      - name: Save the posting log
        run: |
          if [ -n "$(git status --porcelain ig-queue/posted.json)" ]; then
            git config user.name "staysocial-bot"
            git config user.email "staysocial-bot@users.noreply.github.com"
            git add ig-queue/posted.json
            git commit -m "Instagram posting log"
            git pull --rebase origin main
            git push origin main
          fi

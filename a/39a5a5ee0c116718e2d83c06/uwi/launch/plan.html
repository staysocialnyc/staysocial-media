<script type="text/plain" id="md"># Unapologetically West Indian: Launch Plan v2

*Launch lead, 2026-10-19. This replaces v1 (`LAUNCH_PLAN.md`, kept unchanged). It is rebuilt on how the top meme pages with merch actually run.*
*Nothing has been posted, bought, created, filed or sent. This is not legal or tax advice.*

**Where the facts come from**
- **[RP]** `research-v2/reference_pages.md`: 13 meme/culture pages with merch. Instagram numbers come from Meta's read-only API, pulled 2026-10-19. Store prices come from each store's public product list.
- **[IG]** `research-v2/ig_data.md` + `data/uwi/reference_metrics.json`: 18 accounts, 841 posts, scored by "lift". Lift is a post's engagement compared with that page's normal post: 1.0 is normal, 2.0 is twice as good.
- **[ME]** `research-v2/merch_economics.md`. **[LS]** `research-v2/learning_system.md`. **[TB]** `data/uwi/trend_brief.md`. **[PB]** `data/uwi/playbooks/*.md`.
- Every Instagram number links to the page it came from. Anything not verified is marked **unverified**.

## Overview

Unapologetically West Indian (UWI) is a faceless, PG-13 Instagram meme page for every island. It sells its own sayings as print-on-demand merch on Fourthwall's free plan. v2 copies the shape the winning meme-and-merch pages share:
- **One look you recognize at a glance.** The owner picks A, B, C or D.
- **One sign-off on every post:** "Every island knows."
- **6 named recurring series,** and a fan-submission series.
- **2–3 posts a day.**
- **An always-on store with 2 dated drops** tied to Caribbean moments.
- **Rule: posts that win become shirts.**

Stay Social's newsletter (~9,700 subscribers; 9,364–9,382 delivered per issue) and @staysocialnyc (1,119 followers on 2026-10-19, `data/ig_stats.json`) give the page its first audience. Dates:
- Quiet preload Oct 26–28.
- Public launch with the **Thu Oct 29** newsletter.
- Drop 1 "Independence Season": early access **Thu Nov 26**, closes **Mon Nov 30** (Barbados' 60th Independence).
- Drop 2 "Fete Season": **Jan 14 – Feb 28, 2027**.

A weekly learning loop decides what's "proven". The owner sees **one Sunday approval** and **one Monday report**, and nobody else gets them.

## Content engine

**Format mix (starting point; the learning loop changes it after week 4)**

| Format | Share | Why |
|---|---|---|
| Single card (the chosen look) | 50% | The core of the Laboy model, and the cheapest to make ([IG] point 1) |
| Group-chat / text-thread card | 15% | Family framing performs (1.65x); needs a second template (not built) ([IG]) |
| Carousel (series lists, "Every Island Calls It…") | 20% | 1.08x overall; carousels at 3x+ their page's normal on 6 pages ([TB] §1) |
| Text Reel (card animated, licensed music) | 10% | Test T4: can faceless Reels compete? There's no evidence yet ([PB] content T4) |
| Collab, merch and drop posts | ≤5% | Culture brands that sell keep the product inside the content: RepJa had 8 product mentions in 25 posts ([ME] A7) |

**Daily cadence and times (ET)**
- **Weeks 1–2:** 8:00 AM card + 7:00 PM carousel or Reel (2 a day, so the 39-post bank lasts).
- **Week 3 on:** 8:00 AM, 12:30 PM (weekdays), 7:00 PM. That's about 19 feed posts a week, the volume `content/CONTENT_SYSTEM.md` §1 planned.
- **Stories:** 10 AM, 3 PM, 9 PM (best-post reshare, a "send this to…" card, the series teaser). *These story times are a starting guess; no data was found for them.*
- **Why these times:**
  - Morning 6–9 AM got 1.26x (75 posts), 10 AM–1 PM got 1.03x, and 6–9 PM got 0.95x ([IG] point 9).
  - Stay Social's own 7 PM beats its 9 AM (LOW confidence, `data/ig_learnings.md`).
  - These are starting guesses. Our own data decides after about 4 weeks ([LS] §4).
- Posting runs from GitHub, so it works when the Mac is off (project CLAUDE.md §7).

**Named series (all examples are original and PG-13; series names need the owner's OK)**
1. **Mummy Said** (family framing, about 4 a week)
   - "Me: 34, mortgage, two degrees. My mother: 'Text me when you reach.'"
   - "Caribbean parents won't tell you they're proud of you. They'll tell the whole church instead."
2. **Every Island Calls It…** (carousel, 1 a week)
   - One thing, one slide per island, each with its own name for it, ending with "Every island knows."
   - Every name on a slide must pass the native-reviewer fact check first (v1 to-do #8).
3. **The Types** (recurring characters as text, 2 a week)
   - "The uncle who brings his own speaker to a party that already has a DJ."
   - "The aunty who arrives with empty containers. She knows how this ends."
4. **Family Group Chat** (text-thread template, 2 a week)
   - "Aunty: [voice note, 6:42]. Translation: 'Good morning.'"
   - "Family Group: 47 new messages. All of them are a picture of the same pot."
5. **Fete Recovery** (Sat–Mon, ties to Stay Social's events, 2 a week)
   - "Saturday me bought the all-inclusive. Sunday me would like to speak to whoever approved this."
6. **Independence Season / Island Day** (calendar, warm and never a joke at the island)
   - "Happy Independence, St. Vincent and the Grenadines. Every island knows."
   - Dates are in the Merch calendar below.
7. **Cousin Mail** (fan submissions, from week 2)
   - Rendered in the same template with "Sent by a cousin in [neighborhood]" or the fan's handle.

**Island and safety rules (kept from v1):**
- No island leads more than 2 posts a week, at least 8 islands a week, about 1 in 3 posts pan-Caribbean.
- No phonetic accent spelling, no flags as punchlines, no jokes about faith, disasters or an island in bad news.
- **Hurricane jokes are off-limits** ([TB] §2; https://www.nhc.noaa.gov).
- Never copy: reference captions are deleted after tagging, and the lint blocks drafts with 60%+ word overlap ([LS] §7).

**Submission mechanic**
- A text-only Tally form linked from the bio, story highlights and the newsletter P.S.
- The form asks for permission to post, a credit choice, and the island(s).
- **No merch use** of fan jokes without a lawyer-written release (v1 rule).
- Target: 10+ usable submissions a week by week 6 (v1 §6).
- A weekly story counts submissions by island. It never ranks who's funnier ([PB] growth G5).

## Growth: first 90 days (Day 1 = Thu Oct 29 → Day 90 = Tue Jan 26, 2027)

**Cross-promo from Stay Social (cheapest first audience)**
- **Launch day:**
  - A collab post from both accounts at 7 PM.
  - 3 stories. The owner adds the @mention sticker by hand, because the API can't (CLAUDE.md §7).
  - A permanent @staysocialnyc bio line.
  - A link-in-bio button.
  - Plan: `growth/GROWTH_PLAN.md` §2.
- **Newsletter:**
  - A launch band Oct 29 + Nov 5.
  - "Meme of the Week" card from Nov 12.
  - A footer P.S. asking for Cousin Mail.
  - Every link tagged `utm_campaign=uwi_<issue>`.
- **The newsletter's real size:** about 990 unique opens (987 and 992) and 25–54 clickers an issue (`output/newsletter/2026-10-01/report.md`, `2026-10-08/report.md`).

**Collabs (list approach)**
- Start from the 15 API-checked accounts in `growth/collab_candidates.csv` (13 after the two removals below). Pitch small and mid-size creators first.
  - Shithead Steve's founder: "Most TikTok celebrities don't have a community; they have an audience" (https://www.thedrum.com/news/shithead-steve-creator-shares-3-things-marketers-need-know-about-meme-pages; *QA couldn't reload this page on 2026-10-19, so the quote rests on the research file*).
- Drop @wilsylvince (inactive since 2021, [LS] §2). **Don't pitch @majahhype** (https://jamaicaobserver.com/2023/09/27/majah-hype-facing-major-backlash-for-guyana-is-not-caribbean-comment).
- **Possible local partner:** @iamcaribbeing (Brooklyn, 37K followers, https://www.instagram.com/iamcaribbeing/). Owner decision.
- Claude drafts the pitches; the owner sends them. No paid collabs without the owner's OK.
- Expect 1–2 yeses a month (an assumption, [PB] growth G3).

**Comment and share mechanics**
- Write for **sends**. Instagram's head names watch time, likes and sends as the top signals, and says sends are "slightly more important" for reaching people who don't follow you (https://www.socialmediatoday.com/news/instagram-shares-algorithm-insights-2025/738034/).
- **Test (T2):** a "Send this to the cousin who…" line before the sign-off vs the sign-off alone. Tag/send wording was flat in the reference data (1.02x, 11 posts).
- **Comment-to-win giveaways around drops.** A Slang Teez giveaway drew 63 comments vs its usual 7 ([RP] §10).
  - Cap: about $100 for 90 days.
  - Include the Instagram release line in every giveaway post.
  - NY registration is needed only above $5,000 in prizes (https://dos.ny.gov/games-chance-registration).
- **"Comment X for the link"** (Hija de tu Madre) comes later. It needs comment permissions that Stay Social's Meta key doesn't have yet (CLAUDE.md §7, `ig_replies.mjs`).

**Follower targets** (same as v1). *QA: these are **estimates**, not numbers worked out from data. No source predicts follows for a brand-new meme page; the evidence below only shows growth is slow without a breakout.*

| | Day 30 (Nov 27) | Day 60 (Dec 27) | Day 90 (Jan 26) |
|---|---|---|---|
| Floor | 200 | 350 | 400–600 |
| **Base (plan to this)** | 500–800 | 1,000–1,800 | **1,500–3,000** |
| Stretch (a breakout post or a 100K+ collab) | 2,000+ | 5,000+ | 8,000–10,000+ |

- **Evidence:**
  - Pages with 1K–5K followers grew 22% on average across 2025 and average about 417 views per image post (https://www.socialinsider.io/blog/instagram-hashtag-study/). At that pace, organic growth alone is far below the base case, so the base case depends on Stay Social cross-promo, collabs and sends.
  - @staysocialnyc gained about 4 follows in 2 weeks before its growth push (CLAUDE.md §7 baseline, 2026-10-17).
  - Meme pages grow in lumps through sends, so plan to the base case.
- **We can't count follows until 100 followers.** Before that, judge by reach, sends and profile visits (https://developers.facebook.com/docs/instagram-platform/api-reference/instagram-user/insights).
- **Stop rule:** under 50 net follows a week for 3 weeks running means changing the format mix ([PB] growth §4).
- **Optional $0–50 boost** if under 150 followers by Wed Nov 4. Meta ad prices are unverified.

- **Max one 72-hour "meme drop" a month**, and only when a post clearly breaks out ([ME] §4, D6).
- **Production takes about 3–7 business days plus shipping,** so each drop opens at least 2 weeks before its moment ([ME] E4).

**Posts that win become shirts**
1. **Candidate phrase:** any post that scores **2x or more our median** (the [LS] §4 "Candidate" bar) and sits in the top 3 by saves + sends over the last 8 weeks.
2. **Demand check:** a mockup post with 2 candidates. Saves plus comments naming a design pick the winner (Merch T1).
3. **Gates:** a USPTO search for the phrase, PG-13 and every-island checks, and no fan-written jokes without a release. Then the **owner approves**.
4. **Limit:** at most 1 new design per drop. A per-island-name version only if every island gets one ([RP] §7).

**Print-on-demand to bulk switch point**
- Stay on print-on-demand for at least 6 months ([ME] F1).
- **Move one design to bulk only when it has sold about 50 units on demand, or a Fourthwall minimum-order pre-sale fills.** Minimums start "as low as 24 units" (https://fourthwall.com/bespoke), and Fourthwall creates the charge once the drop window closes with the minimum met (https://help.fourthwall.com/create-and-sell-products/how-to-guides/setting-up-pre-orders-and-made-to-order-products.md). If it isn't met, you cancel the orders or cover the shortfall.
  - The 50-unit threshold is a judgment call.
- **Why wait:** at small runs, bulk saves only about $3–6 a shirt but ties up $400–$650 in cash ([ME] F2).
- **Pay for bulk from merch profit,** not the startup budget.
- **In-person sales need free NY registration first** (https://www.tax.ny.gov/bus/st/register.htm).

**How "proven" is decided ([LS] §4)**
- **Score formula:** shares×5 + saves×4 + comments×3 + follows×10 + likes + reach/25. It's the same formula as Stay Social's `ig_learn.mjs`.
- **Signal:** seen once anywhere. Goes in the brief only.
- **Candidate:** the same pattern beats its page's normal on 3+ reference pages within 14 days, or one of our posts scores 2x+ our median. It becomes an experiment.
- **Proven:** our own posts with the pattern beat our median 3+ times across 2+ weeks, and we have 15+ scored posts in 28 days. It becomes a playbook rule.
- **Retired:** below our median 3 posts in a row, or expired. Meme formats expire at 6 weeks, timing rules at 12, merch rules at 6 months.
- **Weeks 1–4: nothing can be Proven.** Confidence stays LOW ([TB] §0).

**Experiments:** exactly 2 a week across all departments, each marked in the draft. Launch week:
- Family framing vs other cards.
- "Send this to…" line vs sign-off alone.

([TB] §5.) With LOW confidence, change at most 3 slots a week ([LS] §5).

## Risks

- **Trademark (high).** "UNAPOLOGETICALLY" alone is registered for clothing (https://tsdr.uspto.gov/statusview/sn98903878).
  - Fix: the two words always together, the clinic check before samples, and the lint blocks a lone "Unapologetically".
  - **Open:** 10 spots in 5 v1 files still use "Unapologetically." on its own (meme_bank.json, render_cards.mjs, CONTENT_SYSTEM.md ×3, GROWTH_PLAN.md ×3, launch_week.md ×2; [PB] brand_legal B1). Claude fixes them first.
- **Offending an island (high).** Rotation rules, native fact checks, no flags, and a takedown within 24 hours of a caricature complaint.
- **Faceless format may underperform (medium).** The Caribbean hits are on-camera Reels ([IG]).
  - Fix: Reel test T4 in month 1. If cards trail by week 6, the owner decides whether to add a voice or on-camera partner.
- **Running out of jokes (medium).** The 39-post bank lasts about 2–3 weeks. Fix: series make writing faster, plus Cousin Mail.
- **Small merch sales (medium).** Fix: $0 fixed costs, no inventory, hoodies first in winter, and a newsletter drop band ([ME] A4).
- **Drop timing (medium).** If the store or samples slip past Nov 9, fall back to a Nov 30-only drop (v1 §6).
- **Lookalike risk (low).** We borrow Laboy's format only: no "Respectfully", no X logo, no verified badge ([PB] brand_legal B7).
- **News and weather (medium).** The Wednesday news-risk check; no hurricane humor ([TB] §2).
- **Mac off on Saturday (low).** The backup alarm emails the owner.
